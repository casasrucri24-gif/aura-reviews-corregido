name: CD - Publicación de Versiones Oficiales

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Crear Release Oficial
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Zulu) con caché de Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven

      - name: Generar el paquete WAR (sin tests)
        run: mvn -B package -DskipTests

      - name: Crear Release y adjuntar WAR
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.war
