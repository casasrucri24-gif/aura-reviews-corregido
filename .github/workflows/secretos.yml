name: CD - El Guardián de Secretos

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar con Secretos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Zulu) con caché de Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven

      - name: Generar el paquete WAR (sin tests)
        run: mvn -B package -DskipTests

      - name: Desplegar con credenciales de base de datos
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
        run: |
          echo "Desplegando con conexión a base de datos..."
          echo "URL: $DB_URL"
          echo "Usuario: $DB_USERNAME"
          echo "Contraseña: [PROTEGIDA]"
