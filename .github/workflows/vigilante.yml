name: CI - El Vigilante Universal

on:
  push:

jobs:
  build:
    name: Compilar y Verificar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Compilar el proyecto con Maven
        run: mvn compile