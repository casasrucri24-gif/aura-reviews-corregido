<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container py-4">
        <!-- Mensajes de alerta -->
        <div th:if="${mensaje}" class="alert alert-dismissible fade show" 
             th:classappend="'alert-' + ${tipoMensaje}" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1"><i class="bi bi-people me-2"></i>Gestión de Clientes</h1>
                <p class="text-muted mb-0">Total: <span th:text="${totalClientes}" class="fw-bold">0</span> clientes</p>
            </div>
            <a href="/clientes/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Nuevo Cliente
            </a>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Edad</th>
                                <th>Género</th>
                                <th>Intolerancia</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>No hay clientes
                                </td>
                            </tr>
                            <tr th:each="cliente : ${clientes}">
                                <td class="fw-bold" th:text="${cliente.id}"></td>
                                <td th:text="${cliente.nombre}"></td>
                                <td th:text="${cliente.edad}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${cliente.genero == 'Masculino'} ? 'bg-primary' : (${cliente.genero == 'Femenino'} ? 'bg-danger' : 'bg-secondary')"
                                          th:text="${cliente.genero}"></span>
                                </td>
                                <td>
                                    <span th:if="${cliente.intolerancia}" class="badge bg-warning text-dark">Sí</span>
                                    <span th:unless="${cliente.intolerancia}" class="badge bg-success">No</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/clientes/detalle/{id}(id=${cliente.id})}" class="btn btn-outline-info" title="Ver">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" class="btn btn-outline-danger" 
                                           onclick="return confirm('¿Eliminar este cliente?')" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
