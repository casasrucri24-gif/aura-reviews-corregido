<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card">
                    <div class="card-header bg-white py-3">
                        <h4 class="mb-0"><i class="bi bi-chat-square-text me-2"></i><span th:text="${titulo}"></span></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/reviews/guardar}" th:object="${review}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="clienteId" class="form-label">Cliente <span class="text-danger">*</span></label>
                                <select class="form-select" id="clienteId" name="clienteId" required>
                                    <option value="">Selecciona un cliente...</option>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}" 
                                            th:text="${cliente.nombre}"></option>
                                </select>
                                <div class="form-text">Solo clientes sin review</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Valoración <span class="text-danger">*</span></label>
                                <div class="btn-group" role="group">
                                    <input type="radio" class="btn-check" name="valoracion" id="star1" value="1" required>
                                    <label class="btn btn-outline-warning" for="star1">1 ★</label>
                                    <input type="radio" class="btn-check" name="valoracion" id="star2" value="2">
                                    <label class="btn btn-outline-warning" for="star2">2 ★</label>
                                    <input type="radio" class="btn-check" name="valoracion" id="star3" value="3">
                                    <label class="btn btn-outline-warning" for="star3">3 ★</label>
                                    <input type="radio" class="btn-check" name="valoracion" id="star4" value="4">
                                    <label class="btn btn-outline-warning" for="star4">4 ★</label>
                                    <input type="radio" class="btn-check" name="valoracion" id="star5" value="5">
                                    <label class="btn btn-outline-warning" for="star5">5 ★</label>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="4" required maxlength="500"></textarea>
                            </div>
                            
                            <div class="d-flex gap-2 justify-content-end mt-4">
                                <a href="/reviews" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
